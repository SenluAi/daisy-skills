# Cloudflare Cron Worker 配置模板 —— 由技能 website-auto-update 提供
# 用法：拷到 Worker 项目根目录，改 name / crons，然后 npx wrangler deploy
name = "site-auto-update-cron"
main = "cron-worker.js"
compatibility_date = "2026-01-01"

# 定时表达式一律 UTC：北京 09:00 = 01:00 UTC
#   每天一次   0 1 * * *
#   每两天一次 0 1 */2 * *
#   每周一次   0 1 * * 1
[triggers]
crons = ["0 1 */2 * *"]

[vars]
# 明文配置放这里（不要放密钥，vars 对账号里有读权限的人都可见）
CHECK_URL = "" # 可选：原站列表接口；配合下面的 KV 绑定，用来预判有没有新增再决定是否重建

# 可选：用 KV 记住原站内容指纹，无变化时不触发 Pages 构建
# [[kv_namespaces]]
# binding = "KV"
# id = "<你的 KV namespace id>"

# 密钥用命令行写入，加密存在 Cloudflare 侧，本地和仓库里都不留明文：
#   npx wrangler secret put DEPLOY_HOOK_URL   # Pages Deploy Hook 完整地址
#   npx wrangler secret put ADMIN_KEY         # 手动触发口令
#
# 先本地干跑看语法：npx wrangler dev --test-scheduled
# 部署：npx wrangler deploy
# 实时日志：npx wrangler tail
